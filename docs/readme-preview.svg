<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Obstacle Avoiding Car Logic</title>
  <desc id="desc">A visual diagram of an Arduino robot car scanning and avoiding obstacles.</desc>
  <rect width="1200" height="620" rx="32" fill="#f8fafc"/>
  <circle cx="1035" cy="120" r="170" fill="#dbeafe"/>
  <circle cx="140" cy="540" r="170" fill="#e0f2fe"/>
  <text x="70" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#172033">Obstacle Avoiding Car</text>
  <text x="70" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#52616b">Median-filtered distance sensing, emergency braking, and turn verification.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="430" y="260" width="340" height="190" rx="36" fill="#172033"/>
    <rect x="470" y="300" width="260" height="86" rx="24" fill="#334155"/>
    <circle cx="505" cy="475" r="42" fill="#0f172a"/>
    <circle cx="695" cy="475" r="42" fill="#0f172a"/>
    <rect x="545" y="210" width="110" height="80" rx="18" fill="#38bdf8"/>
    <text x="565" y="260" font-size="20" font-weight="700" fill="#082f49">HC-SR04</text>
    <path d="M600 205 C520 160 440 165 360 205" stroke="#38bdf8" stroke-width="6" fill="none" stroke-dasharray="12 10"/>
    <path d="M600 205 C680 160 760 165 840 205" stroke="#38bdf8" stroke-width="6" fill="none" stroke-dasharray="12 10"/>
    <rect x="90" y="245" width="245" height="78" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="122" y="294" font-size="22" font-weight="700" fill="#172033">Measure distance</text>
    <rect x="90" y="360" width="245" height="78" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="122" y="409" font-size="22" font-weight="700" fill="#172033">Median filter</text>
    <rect x="865" y="245" width="245" height="78" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="900" y="294" font-size="22" font-weight="700" fill="#172033">Scan left/right</text>
    <rect x="865" y="360" width="245" height="78" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="904" y="409" font-size="22" font-weight="700" fill="#172033">Turn + verify</text>
    <g stroke="#0ea5e9" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M340 284 H420"/>
      <path d="M340 399 H420"/>
      <path d="M780 284 H855"/>
      <path d="M780 399 H855"/>
    </g>
  </g>
</svg>

