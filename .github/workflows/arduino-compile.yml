name: Arduino compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-uno:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Prepare Arduino sketch layout
        shell: bash
        run: |
          mkdir -p build/sketch/obstacle_avoiding_car
          find . -maxdepth 1 -type f \
            \( -name '*.ino' -o -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cpp' \) \
            -exec cp '{}' build/sketch/obstacle_avoiding_car/ \;

      - name: Compile for Arduino Uno
        uses: arduino/compile-sketches@d7af6619a62e765d91f0a4d65b40cf061537a15d # v1.1.3
        with:
          fqbn: arduino:avr:uno
          libraries: |
            - name: Servo
          sketch-paths: |
            - build/sketch
          enable-warnings-report: true
